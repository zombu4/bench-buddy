name: build

# Builds all three self-contained installers.  Every job produces an artifact
# that a target machine can run without installing Python, Qt, NumPy or Pillow.
#
# A note on the Linux runner, because it decides who can install the .deb:
# glibc is backwards compatible but not forwards compatible, so the .deb built
# here requires *at least* the glibc of the runner it was built on.
# `ubuntu-latest` currently means Ubuntu 24.04 (glibc 2.39), which would exclude
# Debian 12 (2.36) and Ubuntu 22.04 (2.35).  The Linux job is therefore pinned to
# `ubuntu-22.04` (glibc 2.35) so the .deb installs on those distributions.  Do
# not "modernise" it to ubuntu-latest without meaning to drop them.
#
# The build script measures the real floor with objdump over the finished
# payload and stamps it into the package's `Depends:` line, so the constraint is
# enforced by dpkg at install time rather than discovered at runtime.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            artifact: bench-buddy-windows
          - os: macos-latest
            label: macOS disk image
            artifact: bench-buddy-macos
          # Pinned deliberately, not stale: see the glibc note at the top of this
          # file.  22.04 (glibc 2.35) is the oldest runner still supported by
          # GitHub, and building here is what lets the .deb install on Debian 12
          # and Ubuntu 22.04.  Moving to ubuntu-latest silently drops both.
          - os: ubuntu-22.04
            label: Debian package
            artifact: bench-buddy-debian

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build and runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0"

      # Qt's xcb platform plugin dlopen()s these; they are the only things the
      # .deb declares as dependencies, and the smoke test needs them present.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 \
            binutils dpkg-dev lintian xvfb

      - name: Generate icons
        shell: bash
        run: python packaging/make_icons.py

      # ------------------------------------------------------------- Windows
      # Inno Setup 6 ships preinstalled on the GitHub windows-latest image, and
      # build_windows.ps1 already probes that location. Do NOT use winget here:
      # it needs App Installer and an interactive user session, and is not
      # dependable on a runner. Chocolatey is present and is the fallback.
      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            Write-Host "Inno Setup already present: $found"
          } else {
            Write-Host 'Inno Setup not found on the runner; installing via Chocolatey.'
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup (exit $LASTEXITCODE)" }
          }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1

      # --------------------------------------------------------------- macOS
      # Unsigned: no Apple Developer ID is configured for this project. The
      # build script applies an ad-hoc signature, which is what makes an arm64
      # bundle executable at all, and is not a trust decision. Users must
      # right-click > Open on first launch; the README and the disk image both
      # say so.
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: bash packaging/build_macos.sh

      # -------------------------------------------------------------- Debian
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: bash packaging/build_debian.sh

      # ---------------------------------------------------------- smoke test
      # Prove the frozen build starts on a machine with no project checkout in
      # play: it must load its own four bundled fonts (app/ui/theme.load_fonts
      # raises rather than falling back to a system face) and stand up a Qt
      # window. There is no instrument on a CI runner, so it is pointed at a
      # dead address and is expected to be still alive, showing its
      # disconnected state, when the timeout fires.
      - name: Smoke test the frozen build (Linux)
        if: runner.os == 'Linux'
        run: |
          set -x
          xvfb-run -a timeout --signal=TERM 25 \
            "build/dist/bench-buddy/bench-buddy" --instrument 127.0.0.1 && rc=0 || rc=$?
          if [ "$rc" != "124" ] && [ "$rc" != "143" ] && [ "$rc" != "0" ]; then
            echo "frozen app exited early with $rc"; exit 1
          fi
          echo "frozen app survived 25 s"

      - name: Smoke test the frozen build (macOS)
        if: runner.os == 'macOS'
        run: |
          set -x
          "build/dist/Bench Buddy.app/Contents/MacOS/bench-buddy" --instrument 127.0.0.1 &
          pid=$!
          sleep 25
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "frozen app exited early"; exit 1
          fi
          kill "$pid" || true
          echo "frozen app survived 25 s"

      - name: Smoke test the frozen build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\dist\bench-buddy\bench-buddy.exe" -ArgumentList "--instrument","127.0.0.1" -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { throw "frozen app exited early with $($p.ExitCode)" }
          $p.Kill()
          Write-Host "frozen app survived 25 s"

      # ----------------------------------------------------------- artifacts
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/installer/*.exe
            build/installer/*.deb
            build/installer/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installers to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          fail_on_unmatched_files: true
          body: |
            Self-contained installers for Bench Buddy.
            Nothing else needs to be installed on the target machine.

            **macOS users:** this build is not signed with an Apple Developer
            ID and is not notarised. On first launch, right-click the app in
            Applications and choose **Open**, then confirm. Once only.
